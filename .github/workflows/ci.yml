name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LayoutProps, PageProps and friends are generated by Next, not written by hand,
      # and tsconfig includes .next/types. Without this step tsc runs before anything has
      # created them and dies on the first app-router file -- which is why every CI run
      # since the app was added failed here, skipping the tests, the build and everything
      # else. typegen emits just those definitions, without a full build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Regenerates tokens and the registry, then runs both checks: that every dependency
      # and theme variable resolves, and that no source file uses a raw palette class, a
      # hex literal, a Button-as-link, or a second primitive library.
      - name: Build design system
        run: npm run build:ds

      # The registry is committed because consumers fetch it from the repository. If a
      # component changed without the registry being rebuilt, the published item no longer
      # matches its source -- and the failure would surface in someone else's project, not
      # here. This is the step that stops that.
      - name: Registry is up to date
        run: |
          if [ -n "$(git status --porcelain public/registry src/app/globals.css)" ]; then
            echo "Generated output is stale. Run 'npm run build:ds' and commit the result."
            git --no-pager diff --stat public/registry src/app/globals.css
            exit 1
          fi

      - run: npx playwright install --with-deps chromium

      # Storybook stories run in a real browser with the a11y addon at 'error', so a
      # violation fails the build rather than being noted in a panel nobody opens.
      #
      # No --project filter. vitest.config.ts defines one project per variant -- storybook,
      # storybook-radix, storybook-aria -- and a port is only proven by running its own tree.
      # Filtering to a single project ran 80 of the 240 tests and left both ported variants
      # entirely unverified, which is exactly where a regression would hide.
      - name: Test (Storybook + accessibility, all variants)
        run: npx vitest run

      - name: Build
        run: npx next build
